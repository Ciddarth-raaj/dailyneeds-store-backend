# Deploy backend to dnds-be on push to main-autodeploy.
#
# Required GitHub Actions secrets:
#   SSH_PRIVATE_KEY  - private key with access to dnds-be (e.g. ~/.ssh/dnds-gha-deploy)
#   SSH_HOST         - 3.109.76.230
#   SSH_USER         - ec2-user
#
# Optional GitHub Actions secrets:
#   ANTHROPIC_API_KEY - used by the offer talker photo check. Synced into the
#     server's .env on every deploy, so rotating it means updating the secret
#     and re-running this workflow - no SSH session needed. Leave it unset and
#     the sync step is skipped, leaving any hand-set value on the server alone.
#
# One-time setup:
#   1. Install the matching public key in ec2-user's authorized_keys on dnds-be.
#   2. On the server, ensure ~/dailyneeds-store-backend can git fetch/pull (private
#      repo credentials on the server — separate from the Actions→server key).
#   3. Server clone must be able to check out main-autodeploy.
#
# DB credentials stay on the server (migrations/mysql/database.json) — not in Actions.
#
# Note: "on" is quoted so YAML 1.1 does not treat it as a boolean (true).

name: Deploy Backend

"on":
  push:
    branches:
      - main-autodeploy
  workflow_dispatch:
    inputs:
      take_db_backup:
        description: "Take the pre-deploy database backup on THIS run (skipped by default)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/dnds_gha_deploy
          chmod 600 ~/.ssh/dnds_gha_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Sent over stdin rather than as an argument, so the key never appears in
      # the server's process list. Rewrites just its own line in .env and
      # leaves every other variable untouched.
      - name: Sync ANTHROPIC_API_KEY to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "ANTHROPIC_API_KEY secret not set - leaving the server's .env as it is."
            exit 0
          fi
          printf '%s\n' "$ANTHROPIC_API_KEY" | ssh -i ~/.ssh/dnds_gha_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            'set -euo pipefail
             read -r NEW_KEY
             cd ~/dailyneeds-store-backend
             touch .env
             grep -v "^ANTHROPIC_API_KEY=" .env > .env.tmp || true
             printf "ANTHROPIC_API_KEY=%s\n" "$NEW_KEY" >> .env.tmp
             mv .env.tmp .env
             chmod 600 .env
             echo "ANTHROPIC_API_KEY written to .env"'

      # PRE-DEPLOY BACKUP. Only when the commit being deployed brings new
      # migrations. Runs BEFORE the pull, with the repository's own
      # scripts/auth/backup-user-tables.sh (mysqldump --single-transaction
      # --skip-lock-tables: no locks, no writes; it verifies gzip, the dump
      # trailer and the table count, and writes a sha256 manifest). Anything
      # failing here fails the job before the server's code or database is
      # touched. Host and user names are masked in this log; no password is
      # ever printed (credentials stay in a mode-600 file on the server).
      # SKIPPED BY DEFAULT, at the owner's request (2026-10-21): the server's
      # disk cannot hold a full dump of the 29 GB database, so every deploy
      # with a migration was stopping here. Push deploys now go without it
      # and say so in the log. A manual run with take_db_backup ticked still
      # takes it - do that before a risky migration once there is space.
      - name: Pre-deploy database backup SKIPPED (default; owner-authorized)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.take_db_backup) }}
        run: echo "WARNING - no pre-deploy database backup taken for this run (skipped by default; run manually with take_db_backup to take one)."

      - name: Pre-deploy database backup (when migrations are pending)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.take_db_backup }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dnds_gha_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            'set -euo pipefail
             cd ~/dailyneeds-store-backend
             git fetch origin
             NEW="$(git diff --name-only HEAD origin/main-autodeploy -- migrations/mysql/migrations/ | grep -E "^migrations/mysql/migrations/[0-9]+-[^/]+[.]js$" || true)"
             if [ -z "$NEW" ]; then echo "No new migrations in this deploy - no backup needed."; exit 0; fi
             echo "Migrations this deploy will run:"; echo "$NEW"
             BIN="$HOME/mysql84/bin"
             [ -x "$BIN/mysqldump" ] || { echo "FAIL: MySQL 8.4 client not found at $BIN - no backup taken; deploy stopped before any change"; exit 1; }
             # The backup tooling comes from the commit being deployed, not
             # from the server checkout this step runs before pulling.
             TOOLS="$(mktemp -d)"; trap "rm -rf \"$TOOLS\"" EXIT
             git archive origin/main-autodeploy scripts/auth | tar -x -C "$TOOLS"
             ln -s "$PWD/config.json" "$TOOLS/config.json"
             node "$TOOLS/scripts/auth/db-defaults-file.js" app > /dev/null
             OUT="$HOME/db-backups/pre-deploy"
             SKIP_ROUTINES=1 MYSQL_BIN_DIR="$BIN" "$TOOLS/scripts/auth/backup-user-tables.sh" "$OUT" 2>&1 \
               | sed -E -e "s/^(host|user)=.*/\1=<hidden>/" \
                        -e "s/\x27[^\x27 ]+\x27@\x27[^\x27 ]*\x27/<user>@<host>/g" \
                        -e "s/\`[^\` ]+\`@\`[^\` ]*\`/<user>@<host>/g" \
                        -e "s/(dump_identity=|dump identity: )[^ (]+/\1<hidden> /" \
                        -e "s/(MySQL server on )\x27[^\x27]*\x27/\1<host>/"
             MANIFEST="$(ls -t "$OUT"/*-manifest-*.txt | head -1)"
             grep -E "^[0-9a-f]{64}  " "$MANIFEST" | sha256sum -c -
             echo "PRE-DEPLOY BACKUP OK: $MANIFEST"'

      - name: Deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dnds_gha_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            'set -euo pipefail
             cd ~/dailyneeds-store-backend
             git fetch origin
             # npm i rewrites package-lock.json on the server, leaving the clone
             # permanently dirty. That is harmless until a commit touches the
             # lockfile - then the pull refuses to overwrite it and the deploy
             # dies. The committed lockfile is the authoritative one, so drop
             # the local rewrite. Drift in any other tracked file is not
             # expected, and is deliberately left to fail loudly.
             git checkout -- package-lock.json || true
             git checkout main-autodeploy
             git pull origin main-autodeploy
             npm i
             cd migrations/mysql
             db-migrate up
             cd ../..
             # EVERY long-running process that runs this code is reloaded
             # here, and each is checked to be back online - see
             # scripts/deploy/pm2-reload.js. It reloads the API and, when it
             # is running, the Biomax receiver.
             #
             # IT NEVER STARTS ANYTHING. The receiver stays out of
             # ecosystem.config.js precisely so that no deploy can bring it
             # up as a side effect: it opens a TCP listener and activating
             # it is a separate approved production action. A receiver that
             # has never been activated is reported and skipped; one that IS
             # running is reloaded, so a fix to punch dating takes effect
             # without anybody SSHing in to remember it.
             #
             # The script exits non-zero if a process that had to reload did
             # not come back, and `set -e` fails the deploy with it.
             node scripts/deploy/pm2-reload.js'

      # LUNCH OT CORRECTION - PREVIEW ONLY. Read-only: it never passes
      # --apply and writes no attendance, OT or payroll row. It runs after the
      # reload so it reads with the new engine rule, and prints the summary
      # and one line per affected day here for a person to approve; the full
      # JSON stays on the server under logs/. Applying is a separate,
      # approved action (scripts/attendance/lunch-ot-correction.js --apply).
      # A preview failure is reported but does not mark the deploy failed.
      - name: Lunch OT correction preview (read-only)
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dnds_gha_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            'set -euo pipefail
             cd ~/dailyneeds-store-backend
             mkdir -p logs
             OUT="logs/lunch-ot-correction-preview-$(date -u +%Y%m%dT%H%M%SZ).json"
             NODE_ENV=production node scripts/attendance/lunch-ot-correction.js --preview > "$OUT"
             echo "Full preview report: $OUT"'
