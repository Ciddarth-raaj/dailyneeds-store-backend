# Deploy backend to dnds-be on push to main-autodeploy.
#
# Required GitHub Actions secrets:
#   SSH_PRIVATE_KEY  - private key with access to dnds-be (e.g. ~/.ssh/dnds-gha-deploy)
#   SSH_HOST         - 3.109.76.230
#   SSH_USER         - ec2-user
#
# Optional GitHub Actions secrets:
#   ANTHROPIC_API_KEY - used by the offer talker photo check. Synced into the
#     server's .env on every deploy, so rotating it means updating the secret
#     and re-running this workflow - no SSH session needed. Leave it unset and
#     the sync step is skipped, leaving any hand-set value on the server alone.
#
# One-time setup:
#   1. Install the matching public key in ec2-user's authorized_keys on dnds-be.
#   2. On the server, ensure ~/dailyneeds-store-backend can git fetch/pull (private
#      repo credentials on the server — separate from the Actions→server key).
#   3. Server clone must be able to check out main-autodeploy.
#
# DB credentials stay on the server (migrations/mysql/database.json) — not in Actions.
#
# Note: "on" is quoted so YAML 1.1 does not treat it as a boolean (true).

name: Deploy Backend

"on":
  push:
    branches:
      - main-autodeploy
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/dnds_gha_deploy
          chmod 600 ~/.ssh/dnds_gha_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Sent over stdin rather than as an argument, so the key never appears in
      # the server's process list. Rewrites just its own line in .env and
      # leaves every other variable untouched.
      - name: Sync ANTHROPIC_API_KEY to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "ANTHROPIC_API_KEY secret not set - leaving the server's .env as it is."
            exit 0
          fi
          printf '%s\n' "$ANTHROPIC_API_KEY" | ssh -i ~/.ssh/dnds_gha_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            'set -euo pipefail
             read -r NEW_KEY
             cd ~/dailyneeds-store-backend
             touch .env
             grep -v "^ANTHROPIC_API_KEY=" .env > .env.tmp || true
             printf "ANTHROPIC_API_KEY=%s\n" "$NEW_KEY" >> .env.tmp
             mv .env.tmp .env
             chmod 600 .env
             echo "ANTHROPIC_API_KEY written to .env"'

      - name: Deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dnds_gha_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            'set -euo pipefail
             cd ~/dailyneeds-store-backend
             git fetch origin
             # npm i rewrites package-lock.json on the server, leaving the clone
             # permanently dirty. That is harmless until a commit touches the
             # lockfile - then the pull refuses to overwrite it and the deploy
             # dies. The committed lockfile is the authoritative one, so drop
             # the local rewrite. Drift in any other tracked file is not
             # expected, and is deliberately left to fail loudly.
             git checkout -- package-lock.json || true
             git checkout main-autodeploy
             git pull origin main-autodeploy
             npm i
             cd migrations/mysql
             db-migrate up
             cd ../..
             pm2 reload 0'
