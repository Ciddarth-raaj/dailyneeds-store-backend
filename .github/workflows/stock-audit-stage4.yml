# Stock Audit - Stage 4 controlled RetailPilot sync (management-approved 27 Nov 2026).
# Mode comes from .github/stage4-mode:
#   DRYRUN    sync DRY_RUN (reads RetailPilot, counts, writes no mirror rows) + source checks
#   IMPORT    HISTORICAL sync from 25 Nov 2026 + full validation, then (only if both succeed)
#             STOCK_AUDIT_SYNC_ENABLED=true (.env backed up first) so administrators can run
#             later syncs by hand. No schedule is ever registered.
#   VALIDATE  read-only validation only
# READ-ONLY towards RetailPilot. Prints counts and ids only.
name: Stock Audit Stage 4 sync (controlled)

"on":
  push:
    branches: [claude/new-session-71890u]
    paths: [.github/stage4-mode]

jobs:
  stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/dnds_gha_deploy
          chmod 600 ~/.ssh/dnds_gha_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Run
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          MODE="$(head -1 .github/stage4-mode | tr -d '[:space:]')"
          case "$MODE" in DRYRUN|IMPORT|VALIDATE|REVIEW|VARIANCE|SEASON1|SEASONCHECK) ;; *) echo "unknown mode $MODE"; exit 1;; esac
          echo "mode=$MODE"
          scp -q -i ~/.ssh/dnds_gha_deploy -o IdentitiesOnly=yes scripts/stock_audit/stage4_sync.js scripts/stock_audit/stage4_validate.js scripts/stock_audit/stage5_review.js scripts/stock_audit/stage5_variance.js scripts/stock_audit/stage5_season1.js scripts/stock_audit/stage5_seasoncheck.js "${SSH_USER}@${SSH_HOST}:/tmp/"
          ssh -i ~/.ssh/dnds_gha_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}" "MODE=$MODE bash -s" <<'REMOTE'
          set -uo pipefail
          cd ~/dailyneeds-store-backend || exit 1
          trap 'rm -f /tmp/stage4_sync.js /tmp/stage4_validate.js /tmp/stage5_review.js /tmp/stage5_variance.js /tmp/stage5_season1.js /tmp/stage5_seasoncheck.js; rm -rf /tmp/sa_season' EXIT
          E="$(pm2 env 0 2>/dev/null | sed -n 's/^NODE_ENV: //p' | head -1 | tr -d '[:space:]')"; export NODE_ENV="${E:-production}"
          echo "@@SWITCH_BEFORE $(node -e "console.log(JSON.stringify(require('./config/stock_audit')))")"
          case "$MODE" in
            DRYRUN)
              node /tmp/stage4_sync.js DRY_RUN || { echo "@@STOP dry run failed - nothing imported"; exit 1; }
              node /tmp/stage4_validate.js source ;;
            IMPORT)
              node /tmp/stage4_sync.js HISTORICAL || { echo "@@STOP historical sync failed - watermarks unchanged; sync switch NOT enabled"; exit 1; }
              node /tmp/stage4_validate.js full || { echo "@@STOP validation failed - sync switch NOT enabled"; exit 1; }
              if grep -qx 'STOCK_AUDIT_SYNC_ENABLED=false' .env; then
                TS=$(date -u +%Y%m%dT%H%M%SZ)
                cp -p .env ~/env-backups/.env.stage4-$TS && chmod 600 ~/env-backups/.env.stage4-$TS
                sed -i 's/^STOCK_AUDIT_SYNC_ENABLED=false$/STOCK_AUDIT_SYNC_ENABLED=true/' .env
                echo "@@ENV_DIFF $(diff ~/env-backups/.env.stage4-$TS .env | grep -c '^>') changed (backup .env.stage4-$TS)"
                node scripts/deploy/pm2-reload.js
                sleep 5
              else
                echo "@@ENV sync switch line not found as expected - left unchanged"
              fi ;;
            VALIDATE)
              node /tmp/stage4_validate.js full ;;
            SEASONCHECK)
              # the feature branch's code, extracted to /tmp only (the checkout and the running app are untouched)
              git fetch -q origin feat/stock-audit-season && rm -rf /tmp/sa_season && mkdir -p /tmp/sa_season && git archive FETCH_HEAD usecase repository utils constants config services | tar -x -C /tmp/sa_season
              echo "@@BRANCH $(git rev-parse --short FETCH_HEAD)"
              ln -s "$PWD/node_modules" /tmp/sa_season/node_modules
              node /tmp/stage5_seasoncheck.js ;;
            SEASON1)
              node /tmp/stage5_season1.js ;;
            VARIANCE)
              node /tmp/stage5_variance.js ;;
            REVIEW)
              node /tmp/stage5_review.js
              # account 197 in settings / schedules: KEY NAMES only, never values
              echo "@@ENV_KEYS_WITH_197 $(grep -E '=(.*[^0-9])?197([^0-9].*)?$' .env 2>/dev/null | cut -d= -f1 | tr '\n' ' ')"
              echo "@@CONFIG_PATHS_WITH_197 $(node -e "const c=require('./config.json');const o=[];const w=(v,p)=>{if(v&&typeof v==='object')for(const k of Object.keys(v))w(v[k],p+'.'+k);else if(String(v)==='197')o.push(p)};w(c,'');console.log(o.join(' '))")"
              echo "@@CRON_LINES_WITH_197 $(crontab -l 2>/dev/null | grep -cE '(^|[^0-9])197([^0-9]|$)')"
              echo "@@CODE_REFS_197 $(grep -rlE '(user_id|userId|USER_ID)[^0-9]{0,6}197([^0-9]|$)' --include=*.js . 2>/dev/null | grep -v node_modules | head -5 | tr '\n' ' ')" ;;
          esac
          echo "@@SWITCH_AFTER $(node -e "console.log(JSON.stringify(require('./config/stock_audit')))")"
          echo "@@PM2 $(pm2 jlist 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).map(p=>p.name+':'+p.pm2_env.status).join(' | '))}catch(e){console.log('n/a')}})")"
          ERR=$(pm2 logs 0 --err --lines 200 --nostream --raw 2>/dev/null); echo "$ERR" | grep -iE "error|exception|ER_" | grep -i "stock" | tail -5 | cut -c1-160 | sed 's/^/@@ERR /' || true
          REMOTE
