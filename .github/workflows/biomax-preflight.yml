# Biomax Part 1 - the production DEPLOYMENT GATE. Read-only, dispatch only.
#
# Never runs on push. Dispatched by hand with a mode:
#
#   pre    before the Biomax migration - prerequisites that must already hold
#   post   after the migration - schema, seed, permissions, receiver state
#
# Every check below either FAILS the workflow (the deployment must not
# proceed) or is REPORT-ONLY (printed for HR / operations, never fatal):
#
#   FAIL  a required database query errors
#   FAIL  MySQL < 5.7.8
#   FAIL  outlet_id 2 is not the Warehouse, or DN1..DN5 are not all present
#   FAIL  biomax-receiver is present in pm2 in a running/launching state
#   FAIL  something is listening on TCP 7005
#   FAIL  (post) any biomax_* table missing, migration not recorded, seeded
#         devices != 7, any of the seven Cloud IDs missing or altered, WH/G2
#         not on outlet_id 2, a seeded device without an assignment, any of
#         the six permission keys missing
#   REPORT port 82, the API's pm2 runtime, static-IP source column state,
#          working schedule rows without an Attendance Day Cutoff, employees
#          without an assigned shift, punch count
#
# STRICTLY READ-ONLY. No INSERT/UPDATE/DELETE, no migration, no pm2
# start/stop/reload, no firewall change, no device change. Database
# credentials never leave the host: the queries run there through the repo's
# own `mysql` module on the host's Node, reading config.json db.mysql
# (the API's own connection, as drivers/mysql.js does), and only result rows
# are printed. The db-migrate target in migrations/mysql/database.json is
# reported by name so a mismatch with the API database is visible.
#
# Uses the same secrets as the backend deploy: SSH_PRIVATE_KEY, SSH_HOST,
# SSH_USER. "on" is quoted so YAML 1.1 does not treat it as a boolean.

name: Biomax Preflight Gate (read-only)

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: "pre = before the Biomax migration; post = after it"
        required: true
        default: pre
        type: choice
        options:
          - pre
          - post

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate input
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$MODE" in pre|post) echo "mode: $MODE";; *) echo "::error::mode must be pre or post"; exit 1;; esac

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/dnds_gha_deploy
          chmod 600 ~/.ssh/dnds_gha_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # The gate script is a quoted heredoc piped over stdin, so nothing is
      # left on the box and nothing in it is expanded by the runner. The mode
      # arrives as a positional argument, already validated.
      - name: Run the gate on the production host (read-only)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dnds_gha_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" 'bash -s' -- "$MODE" <<'REMOTE'
          set -uo pipefail
          MODE="$1"
          FAILS=0
          fail() { echo "::error::FAIL: $*"; FAILS=$((FAILS+1)); }
          pass() { echo "PASS: $*"; }
          report() { echo "REPORT: $*"; }

          cd ~/dailyneeds-store-backend || { echo "::error::no checkout at ~/dailyneeds-store-backend"; exit 1; }
          echo "=== host ($MODE)"
          echo "user=$(id -un) node=$(node -v) pm2=$(pm2 -v 2>/dev/null || echo n/a)"
          echo "repo HEAD: $(git rev-parse --short HEAD) on $(git rev-parse --abbrev-ref HEAD)"

          echo "=== pm2"
          pm2 ls --no-color 2>/dev/null || true
          echo "--- API (pm2 process 0) runtime - report only"
          pm2 describe 0 --no-color 2>/dev/null | grep -E "status|script path|node.js version|interpreter" || report "pm2 process 0 not described"
          echo "--- biomax-receiver must NOT be running"
          if pm2 describe biomax-receiver >/dev/null 2>&1; then
            STATUS="$(pm2 describe biomax-receiver --no-color 2>/dev/null | grep -E '^\s*│?\s*status' | head -1 | sed -E 's/.*status[^a-z]*([a-z-]+).*/\1/')"
            echo "biomax-receiver present in pm2 with status: ${STATUS:-unknown}"
            case "${STATUS:-unknown}" in
              online|launching|waiting*|restart*) fail "biomax-receiver is RUNNING (status ${STATUS}); the receiver must stay off in this stage";;
              *) report "biomax-receiver is present in pm2 but not running (status ${STATUS:-unknown}); it must not be started";;
            esac
          else
            pass "biomax-receiver is not in pm2"
          fi

          echo "=== listeners"
          LISTEN="$( (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | awk '{print $4}' )"
          if echo "$LISTEN" | grep -Eq '(:|\.)7005$'; then fail "something is listening on TCP 7005"; else pass "nothing listens on 7005"; fi
          if echo "$LISTEN" | grep -Eq '(:|\.)82$'; then report "a listener exists on TCP 82 (reported only, not changed)"; else report "no listener on TCP 82"; fi

          echo "=== local HTTP smoke (read-only GETs against the box's own services)"
          # The API answers on 8080 and the Next.js frontend on 3000, behind
          # nginx. Unauthenticated GETs only. A guarded route proves it exists
          # and is guarded by refusing: this API's auth middleware
          # (middlewares/auth.js) answers HTTP 200 with a JSON body
          # {"code":403,"msg":"Access Denied"}, so `guarded` accepts either a
          # real 401/403 status or a 200 whose body carries code 401/403. A
          # 404 or connection failure would mean the deploy did not land. The
          # receiver's 7005 is checked above and must NOT answer.
          probe() { # label url expected-status-regex
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$2")"; CODE="${CODE:-000}"
            if echo "$CODE" | grep -Eq "$3"; then pass "$1 -> HTTP $CODE"; else fail "$1 -> HTTP $CODE (expected $3)"; fi
          }
          guarded() { # label url
            BODY_FILE="$(mktemp)"
            CODE="$(curl -s -o "$BODY_FILE" -w '%{http_code}' --max-time 10 "$2")"; CODE="${CODE:-000}"
            BODY_CODE="$(tr -d ' \n' < "$BODY_FILE" | grep -Eo '"code":[0-9]+' | head -1 | grep -Eo '[0-9]+')"
            rm -f "$BODY_FILE"
            if echo "$CODE" | grep -Eq '^(401|403)$'; then pass "$1 -> HTTP $CODE (refused)"
            elif [ "$CODE" = "200" ] && echo "$BODY_CODE" | grep -Eq '^(401|403)$'; then pass "$1 -> HTTP 200 with body code $BODY_CODE (refused, app convention)"
            else fail "$1 -> HTTP $CODE body code ${BODY_CODE:-none} (expected the route to refuse an unauthenticated request)"; fi
          }
          probe "API root (8080)"                       "http://127.0.0.1:8080/"                       '^(200|301|302|404)$'
          guarded "API /designation (existing, guarded)" "http://127.0.0.1:8080/designation"
          guarded "API /work-shift (existing, guarded)" "http://127.0.0.1:8080/work-shift"
          if [ "$MODE" = "post" ]; then
            guarded "API /attendance/raw (new, guarded)" "http://127.0.0.1:8080/attendance/raw"
            guarded "API /attendance/devices (new, guarded)" "http://127.0.0.1:8080/attendance/devices"
            probe "FE /attendance/list (new page)"         "http://127.0.0.1:3000/attendance/list"      '^(200|301|302|307|308)$'
            probe "FE /attendance/devices (new page)"      "http://127.0.0.1:3000/attendance/devices"   '^(200|301|302|307|308)$'
          fi
          probe "FE /work-shift (existing page)"         "http://127.0.0.1:3000/work-shift"             '^(200|301|302|307|308)$'
          probe "FE /hr/employees (existing page)"       "http://127.0.0.1:3000/hr/employees"           '^(200|301|302|307|308)$'
          probe "FE / (login)"                            "http://127.0.0.1:3000/"                       '^(200|301|302|307|308)$'

          echo "=== database (read-only) - $MODE"
          # The API's REAL environment: server.js sets global.env from NODE_ENV
          # and falls back to "development" when it is unset. Read it off the
          # running pm2 process rather than assuming "production".
          API_ENV="$(pm2 env 0 2>/dev/null | sed -n 's/^NODE_ENV: //p' | head -1 | tr -d '[:space:]')"
          [ -n "$API_ENV" ] || API_ENV="development"
          echo "API process 0 NODE_ENV resolves to: $API_ENV"
          node - "$MODE" "$API_ENV" <<'NODE'
          const fs = require("fs");
          const mysql = require("mysql");
          const mode = process.argv[2];
          // THE connection dnds.co.in uses: config.json -> db.mysql[env], exactly
          // as drivers/mysql.js builds the API's pool, with env being what the
          // RUNNING API process resolves (argv[3], read from pm2). Never the
          // GoFrugal pool.
          const env = process.argv[3] || "development";
          const appCfg = JSON.parse(fs.readFileSync("config.json", "utf8"));
          const cfg = appCfg.db.mysql[env];
          if (!cfg) { console.log(`::error::FAIL: config.json has no db.mysql.${env} block`); process.exit(3); }
          const conn = mysql.createConnection({
            host: cfg.host, port: cfg.port, user: cfg.username, password: cfg.password,
            database: cfg.database, dateStrings: true, multipleStatements: false,
          });
          // Where `db-migrate up` (run from migrations/mysql with no -e, so
          // env "dev", which db-migrate aliases to "development") will write.
          // It MUST be the same host and database the API reads, otherwise the
          // migration would land somewhere the application never looks.
          let migrateFails = 0;
          try {
            const dbm = JSON.parse(fs.readFileSync("migrations/mysql/database.json", "utf8"));
            const envs = Object.keys(dbm).filter((k) => k !== "defaultEnv");
            const target = dbm.defaultEnv || (dbm.dev ? "dev" : (dbm.development ? "development" : envs[0]));
            const t = dbm[target] || {};
            console.log(`REPORT: migrations/mysql/database.json envs=[${envs.join(",")}] defaultEnv=${dbm.defaultEnv || "(none)"} -> db-migrate target '${target}' = ${t.host}:${t.port}/${t.database}`);
            console.log(`REPORT: API pool (config.json db.mysql.${env}) = ${cfg.host}:${cfg.port}/${cfg.database}`);
            if (String(t.host) !== String(cfg.host) || String(t.database) !== String(cfg.database)) {
              console.log(`::error::FAIL: db-migrate target ${t.host}/${t.database} is not the API database ${cfg.host}/${cfg.database}; the migration would not reach the application's database`);
              migrateFails += 1;
            } else {
              console.log(`PASS: db-migrate target and API pool are the same database (${cfg.database} on ${cfg.host})`);
            }
          } catch (e) { console.log(`::error::FAIL: could not read migrations/mysql/database.json: ${e.message}`); migrateFails += 1; }
          let fails = migrateFails;
          const fail = (m) => { console.log(`::error::FAIL: ${m}`); fails += 1; };
          const pass = (m) => console.log(`PASS: ${m}`);
          const report = (m) => console.log(`REPORT: ${m}`);
          const q = (label, sql) => new Promise((resolve) => {
            conn.query(sql, (err, rows) => {
              console.log(`--- ${label}`);
              if (err) { console.log(`ERROR ${err.code || ""} ${err.message}`); resolve({ err, rows: null }); return; }
              console.log(JSON.stringify(rows));
              resolve({ err: null, rows });
            });
          });
          const required = async (label, sql) => {
            const r = await q(label, sql);
            if (r.err) fail(`required query ${label} errored: ${r.err.code || r.err.message}`);
            return r.rows || [];
          };
          const optional = async (label, sql) => (await q(label, sql)).rows || [];

          const CLOUD_IDS = {
            C26924B2E7351O35: "DN1", C2695C935328OB31: "DN2", C2695C9353290F31: "DN3",
            C26044C84F1A1D31: "DN4", AMDB24121401205: "DN5", C2695C56D30E1430: "WH", AMDB24121401307: "G2",
          };
          const PERMS = ["view_raw_attendance", "export_raw_attendance", "view_attendance_punch_audit",
            "view_biomax_devices", "manage_biomax_devices", "rederive_attendance"];
          const TABLES = ["biomax_device", "biomax_device_assignment", "biomax_device_event", "biomax_punch",
            "biomax_punch_derived", "biomax_raw_request", "biomax_derivation_run", "biomax_derivation_change"];

          function versionAtLeast(v, min) {
            const a = String(v).split("-")[0].split(".").map((n) => parseInt(n, 10) || 0);
            const b = min.split(".").map(Number);
            for (let i = 0; i < 3; i += 1) { if ((a[i] || 0) > b[i]) return true; if ((a[i] || 0) < b[i]) return false; }
            return true;
          }

          (async () => {
            console.log(`api db (config.json db.mysql.${env}): host=${cfg.host} database=${cfg.database} (credentials not printed)`);

            // ---------------------------------------------------- PRE + POST
            const v = await required("VERSION", "SELECT VERSION() AS version");
            const version = v[0] ? v[0].version : null;
            if (!version) fail("could not read MySQL version");
            else if (!versionAtLeast(version, "5.7.8")) fail(`MySQL ${version} is below the required 5.7.8`);
            else pass(`MySQL ${version} >= 5.7.8${versionAtLeast(version, "8.0.16") ? " (CHECK constraints enforced)" : " (CHECK constraints parsed, not enforced)"}`);

            const o2 = await required("OUTLET_2", "SELECT outlet_id, outlet_code, outlet_name, is_active FROM outlets WHERE outlet_id = 2");
            if (o2.length !== 1) fail("outlet_id 2 not found");
            else if (!/warehouse|godown|wh\b/i.test(`${o2[0].outlet_name} ${o2[0].outlet_code}`)) fail(`outlet_id 2 is '${o2[0].outlet_name}' (${o2[0].outlet_code}), not recognisably the Warehouse`);
            else pass(`outlet_id 2 = ${o2[0].outlet_name} (${o2[0].outlet_code})`);

            const dn = await required("OUTLETS_DN1_DN5", "SELECT outlet_id, outlet_code, outlet_name, is_active FROM outlets WHERE UPPER(TRIM(outlet_code)) IN ('DN1','DN2','DN3','DN4','DN5') ORDER BY outlet_code");
            const codes = dn.map((r) => String(r.outlet_code).trim().toUpperCase());
            const missing = ["DN1", "DN2", "DN3", "DN4", "DN5"].filter((c) => !codes.includes(c));
            if (missing.length) fail(`outlet codes missing: ${missing.join(", ")}`); else pass("DN1..DN5 outlet codes present");
            await optional("ALL_OUTLET_CODES", "SELECT outlet_id, outlet_code, outlet_name FROM outlets ORDER BY outlet_id");

            const ip = await required("STATIC_IP_SOURCE", "SELECT outlet_id, outlet_code, ip_restriction_enabled, CASE WHEN allowed_ips IS NULL OR allowed_ips = '' THEN 'empty' ELSE CONCAT(LENGTH(allowed_ips), ' chars set') END AS allowed_ips_state FROM outlets ORDER BY outlet_id");
            if (ip.length) pass("static-IP source columns outlets.allowed_ips / ip_restriction_enabled are readable");

            const wsc = await optional("WORK_SHIFT_COUNTS", "SELECT (SELECT COUNT(*) FROM work_shift) AS work_shifts, (SELECT COUNT(*) FROM new_employee WHERE default_work_shift_id IS NOT NULL AND status = 1) AS active_employees_with_shift, (SELECT COUNT(*) FROM new_employee WHERE status = 1) AS active_employees");
            if (wsc[0]) report(`work shifts: ${wsc[0].work_shifts}; active employees with a shift: ${wsc[0].active_employees_with_shift} of ${wsc[0].active_employees} (HR setup, not a deployment failure)`);
            const noCut = await optional("REPORT_WORKING_ROWS_WITHOUT_CUTOFF", "SELECT ws.shift_code, ws.shift_name, s.day_of_week FROM work_shift_weekly_schedule s JOIN work_shift ws ON ws.work_shift_id = s.work_shift_id WHERE s.is_working_day = 1 AND s.attendance_day_cutoff IS NULL ORDER BY ws.shift_code, s.day_of_week");
            report(`${noCut.length} working schedule row(s) without an Attendance Day Cutoff (set in Shift Management; not a deployment failure)`);

            if (mode === "pre") {
              const t = await optional("BIOMAX_TABLES_BEFORE", "SHOW TABLES LIKE 'biomax%'");
              report(`${t.length} biomax_* table(s) exist before the migration`);
            }

            // ---------------------------------------------------------- POST
            if (mode === "post") {
              const t = await required("BIOMAX_TABLES", "SHOW TABLES LIKE 'biomax%'");
              const names = t.map((r) => Object.values(r)[0]);
              const missingT = TABLES.filter((n) => !names.includes(n));
              if (missingT.length) fail(`biomax tables missing: ${missingT.join(", ")}`); else pass("all eight biomax_* tables exist");

              const mig = await required("MIGRATION_RECORDED", "SELECT name FROM migrations WHERE name LIKE '%biomax-raw-attendance%'");
              if (mig.length !== 1) fail("migration 20260911120000-biomax-raw-attendance is not recorded in `migrations`"); else pass(`migration recorded: ${mig[0].name}`);

              const dev = await required("SEEDED_DEVICES", "SELECT d.biomax_device_id, d.dev_id, d.label, a.outlet_id, o.outlet_code, o.outlet_name, a.effective_from, a.effective_to FROM biomax_device d LEFT JOIN biomax_device_assignment a ON a.biomax_device_id = d.biomax_device_id LEFT JOIN outlets o ON o.outlet_id = a.outlet_id ORDER BY d.biomax_device_id");
              const distinct = new Set(dev.map((r) => r.dev_id));
              if (distinct.size !== 7) fail(`expected exactly 7 seeded devices, found ${distinct.size}`); else pass("exactly 7 devices seeded");
              for (const [id, label] of Object.entries(CLOUD_IDS)) {
                const row = dev.find((r) => r.dev_id === id);
                if (!row) fail(`Cloud ID ${id} (${label}) missing or altered (byte-exact match required)`);
              }
              if (Object.keys(CLOUD_IDS).every((id) => distinct.has(id))) pass("all seven Cloud IDs present verbatim");
              for (const id of ["C2695C56D30E1430", "AMDB24121401307"]) {
                const row = dev.find((r) => r.dev_id === id);
                if (!row || Number(row.outlet_id) !== 2) fail(`${id} (${CLOUD_IDS[id]}) is not assigned to outlet_id 2`);
              }
              if (["C2695C56D30E1430", "AMDB24121401307"].every((id) => { const r = dev.find((x) => x.dev_id === id); return r && Number(r.outlet_id) === 2; })) pass("WH and G2 both map to outlet_id 2 (Warehouse)");
              const unassigned = dev.filter((r) => r.outlet_id === null || r.outlet_id === undefined);
              if (unassigned.length) fail(`seeded device(s) without an assignment: ${unassigned.map((r) => `${r.dev_id} (${r.label})`).join(", ")}`); else pass("every seeded device has an assignment");
              for (const [id, label] of Object.entries(CLOUD_IDS)) {
                const row = dev.find((r) => r.dev_id === id);
                if (row && label.startsWith("DN") && String(row.outlet_code || "").toUpperCase() !== label) fail(`${id} (${label}) is assigned to ${row.outlet_code}, expected ${label}`);
              }

              const perms = await required("PERMISSION_KEYS", `SELECT permission_key FROM all_permissions WHERE permission_key IN (${PERMS.map((p) => `'${p}'`).join(",")}) ORDER BY permission_key`);
              const have = perms.map((r) => r.permission_key);
              const missingP = PERMS.filter((p) => !have.includes(p));
              if (missingP.length) fail(`permission keys missing: ${missingP.join(", ")}`); else pass("all six permission keys declared");
              await optional("GRANTS_HR_EXECUTIVE", "SELECT p.permission_key, d.designation_name FROM permissions p JOIN designation d ON d.designation_id = p.designation_id WHERE p.permission_key IN ('view_raw_attendance','export_raw_attendance','view_attendance_punch_audit') AND p.is_active = 1 ORDER BY p.permission_key");

              const pc = await required("PUNCH_COUNT", "SELECT COUNT(*) AS punches FROM biomax_punch");
              report(`punch count: ${pc[0] ? pc[0].punches : "?"} (expected 0 before the receiver is ever started)`);
            }

            conn.end();
            console.log(`=== database checks: ${fails} failure(s)`);
            process.exit(fails > 0 ? 2 : 0);
          })().catch((e) => { console.log(`::error::FAIL: gate script crashed: ${e && e.stack ? e.stack : e}`); process.exit(3); });
          NODE
          DB_RC=$?
          [ "$DB_RC" -eq 0 ] || FAILS=$((FAILS+1))

          echo "=== GATE RESULT ($MODE): $FAILS failing check group(s)"
          if [ "$FAILS" -gt 0 ]; then echo "::error::Biomax $MODE gate FAILED - do not proceed"; exit 1; fi
          echo "Biomax $MODE gate PASSED"
          REMOTE
