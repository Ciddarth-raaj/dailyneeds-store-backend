# Stock Audit - Phase 2 readiness + reconciliation. Strictly READ-ONLY.
#
# Pipes scripts/stock_audit/phase2_readiness.bundle.js (built from
# feat/stock-audit-foundation scripts/stock_audit/phase2_readiness.js) to
# `node -` on the production host inside ~/dailyneeds-store-backend. SELECTs
# only (SPECTRA and MySQL) plus df / lsblk / tool-version checks. Writes
# nothing, changes no file, takes no backup, runs no migration. Never prints
# keys, hosts or personal names.
#
# Same secrets as the backend deploy: SSH_PRIVATE_KEY, SSH_HOST, SSH_USER.

name: Stock Audit Phase 2 Readiness (read-only)

"on":
  workflow_dispatch:
  push:
    branches: [claude/new-session-71890u]
    paths:
      - .github/workflows/stock-audit-phase2-readiness.yml
      - scripts/stock_audit/phase2_readiness.bundle.js

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/dnds_gha_deploy
          chmod 600 ~/.ssh/dnds_gha_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Readiness and reconciliation (read-only)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dnds_gha_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "cd ~/dailyneeds-store-backend && API_ENV=\$(pm2 env 0 2>/dev/null | sed -n 's/^NODE_ENV: //p' | head -1 | tr -d '[:space:]'); node - \"\${API_ENV:-production}\"" \
            < scripts/stock_audit/phase2_readiness.bundle.js
